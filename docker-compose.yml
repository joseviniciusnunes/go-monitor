services:
  go-monitor:
    # Imagem multi-arquitetura (amd64 + arm/v7 + arm64). Se sua infraestrutura não
    # puder usar buildx multi-arch automaticamente, force a plataforma do
    # Orange Pi PC Plus (Allwinner H3, ARMv7): platform: linux/arm/v7
    # platform: linux/arm/v7
    # Tag da imagem: mantenha em sincronia com a VERSION do build.yml
    image: ghcr.io/joseviniciusnunes/go-monitor:2.0.0
    container_name: go-monitor
    restart: unless-stopped
    environment:
      MQTT_BROKER: "tcp://192.168.1.100:1883"
      MQTT_USER: "admin"
      MQTT_PASSWORD: "*******"
      # MONITOR_ID: identificador ÚNICO desta instância. O tópico MQTT é
      # SEMPRE montado pelo código como /homeassistant/go-monitor/<MONITOR_ID>/metrics,
      # além do ID do dispositivo no Home Assistant e o client ID do broker.
      # Com DOIS go-monitor na rede, defina um valor DIFERENTE em cada um:
      #   placa A: MONITOR_ID: "orange-pi-4-pro"
      #   placa B: MONITOR_ID: "orange-pi-pc-plus"
      # Se não for definido aqui, o tópico usa o default "default".
      MONITOR_ID: "orange-pi-4-pro"
      PUBLISH_INTERVAL: "3"
      # Nível de log: "error" (só erros) ou "verbose" (tudo)
      LOG_LEVEL: "error"
      # Caminhos do host montados no container
      SYSFS_ROOT: "/sys"
      DISK_PATH: "/host/root"
      # Prefixo do MQTT discovery do Home Assistant
      DISCOVERY_PREFIX: "homeassistant"
      # Nome do dispositivo exibido no Home Assistant
      DEVICE_NAME: "Orange Pi 4 Pro"
    volumes:
      # Monta a raiz do host para ler o uso do disco
      - /:/host/root:ro
    # Modo host para que as métricas reflitam o host (não o container)
    network_mode: host
    # Necessário para ler o sysfs do host (temperatura da CPU)
    privileged: true
