name: Build ARM image

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}
    # Versão do container: incremente a cada release.
    # A imagem será publicada como ghcr.io/<org>/go-monitor:<VERSION>
    VERSION: 1.0.0

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up QEMU (emulação multi-arquitetura)
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login no GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extrair metadados da imagem
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=${{ env.VERSION }}
                      type=sha

            - name: Build e push (multi-arquitetura)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  # ARM64 = Orange Pi 4 Pro (RK3588)
                  # ARM/v7 = Orange Pi PC Plus (Allwinner H3)
                  platforms: linux/arm64,linux/arm/v7
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
